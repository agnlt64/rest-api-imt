openapi: 3.0.3
info:
  title: Movie Service API
  description: API for listing, retrieving, creating, deleting, and rating movies.
  version: "1.0.0"
servers:
  - url: http://localhost:3200
    description: Local development server

tags:
  - name: movies
    description: Movie catalog operations

paths:
  /:
    get:
      tags: [movies]
      summary: Service home page
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
                example: "<h1 style='color:blue'>Welcome to the Movie service!</h1>"

  /movies/list/all:
    get:
      tags: [movies]
      summary: Retrieve all movies
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
              example:
                - title: The Good Dinosaur
                  rating: 7.4
                  director: Peter Sohn
                  id: 720d006c-3a57-4b6a-b18f-9b713b073f3c

  /movies/{movieid}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [movies]
      summary: Retrieve a movie by ID
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: movie ID not found
    post:
      tags: [movies]
      summary: Add a movie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Movie"
            example:
              title: The Good Dinosaur
              rating: 7.4
              director: Peter Sohn
              id: 720d006c-3a57-4b6a-b18f-9b713b073f3c
      responses:
        "200":
          description: Movie added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: movie added
        "400":
          description: Malformed movie body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Movie already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: movie already exists
    delete:
      tags: [movies]
      summary: Delete a movie
      responses:
        "200":
          description: Deleted movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /movies/info:
    get:
      tags: [movies]
      summary: Retrieve a movie by exact title
      parameters:
        - name: title
          in: query
          required: true
          description: Exact movie title.
          schema:
            type: string
            example: The Martian
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie title not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /movies/rating/{movieid}:
    put:
      tags: [movies]
      summary: Update a movie rating
      parameters:
        - $ref: "#/components/parameters/MovieId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: number
                  format: float
                  example: 8.5
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Unique movie identifier.
      schema:
        type: string
        format: uuid
        example: 720d006c-3a57-4b6a-b18f-9b713b073f3c
  schemas:
    Movie:
      type: object
      required: [id, title, rating, director]
      properties:
        id:
          type: string
          format: uuid
          example: 720d006c-3a57-4b6a-b18f-9b713b073f3c
        title:
          type: string
          example: The Good Dinosaur
        rating:
          type: number
          format: float
          example: 7.4
        director:
          type: string
          example: Peter Sohn
    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: movie added
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: movie ID not found
